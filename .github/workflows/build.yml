name: Compile Windows Executable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-numeric-version: '3.10'

    - name: Install Compiling Engines
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller

    - name: Build Single Executable File
      run: |
        pyinstaller --noconsole --onefile main.py

    - name: Upload Finished App
      uses: actions/upload-artifact@v4
      with:
        name: ClientTaskTracker-App
        path: dist/main.exe
